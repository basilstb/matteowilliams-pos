# Render deployment blueprint for Matteo Williams Electronics POS
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: matteowilliams-pos
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn matteowilliams_project.wsgi:application"
    plan: free
    domains:
      - matteowilliams.org
      - www.matteowilliams.org
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "matteowilliams.org,www.matteowilliams.org,.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: matteowilliams-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: matteowilliams-db
    databaseName: matteowilliams
    plan: free
