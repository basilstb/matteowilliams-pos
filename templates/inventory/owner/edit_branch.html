{% extends "base.html" %}

{% block title %}Edit {{ branch.name }} | Matteo Williams{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8 w-full">
    
    <a href="{% url 'inventory:owner_branches' %}" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-slate-400 hover:text-white mb-4 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Back to Branches</span>
    </a>

    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        <div class="flex items-center justify-between pb-5 border-b border-slate-800">
            <div>
                <span class="text-xs font-mono font-bold text-cyan-400">{{ branch.code }}</span>
                <h1 class="text-2xl font-black text-white mt-0.5">{{ branch.name }}</h1>
                <p class="text-xs text-slate-400 mt-0.5">Modify branch metadata or reset cashier / manager PINs.</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300">
                <i data-lucide="edit-3" class="w-5 h-5"></i>
            </div>
        </div>

        <form method="POST" class="mt-6 space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Branch Shop Name</label>
                <input type="text" name="name" value="{{ branch.name }}" required
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Branch Code (Fixed)</label>
                    <input type="text" value="{{ branch.code }}" readonly
                        class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-sm font-mono text-slate-500 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Phone Number</label>
                    <input type="text" name="phone" value="{{ branch.phone|default:'' }}"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Onitsha Location Address</label>
                <input type="text" name="location" value="{{ branch.location }}" required
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <!-- PINs Reset -->
            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-300 block">Security PIN Reconfiguration</span>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-emerald-400 mb-1.5">Cashier PIN</label>
                        <input type="text" name="cashier_pin" value="{{ branch.cashier_pin }}" required
                            class="w-full px-4 py-2.5 bg-slate-900 border border-emerald-600/50 rounded-xl text-sm font-mono font-bold text-white text-center focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-indigo-400 mb-1.5">Manager PIN</label>
                        <input type="text" name="manager_pin" value="{{ branch.manager_pin }}" required
                            class="w-full px-4 py-2.5 bg-slate-900 border border-indigo-600/50 rounded-xl text-sm font-mono font-bold text-white text-center focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2 pt-2">
                <input type="checkbox" id="is_active" name="is_active" {% if branch.is_active %}checked{% endif %}
                    class="w-4 h-4 rounded text-emerald-600 bg-slate-950 border-slate-700 focus:ring-emerald-500">
                <label for="is_active" class="text-xs text-slate-300">Branch is Active & Accepting Sales</label>
            </div>

            <button type="submit" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 mt-4">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Save Branch Settings</span>
            </button>
        </form>

    </div>
</div>
{% endblock %}
